spring.application.name=demo

# Puerto configurable por entorno (SERVER_PORT); 8082 por defecto
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:h2:mem:deliverygo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql con datos de prueba: se ejecuta después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Especificación OpenAPI con claves ordenadas, para que doc/openapi.yaml no cambie de orden entre corridas
springdoc.writer-with-order-by-keys=true

# DM-17: clave HMAC con la que el módulo Usuarios firma los tokens (INT-01). Mínimo 32 bytes.
# El valor por defecto es solo para desarrollo local: con él siguen andando los tokens de prueba de doc/CAMBIOS.md
app.jwt.secret=${JWT_SECRET:DeliveryGo-Clave-Secreta-JWT-2026-UADE-API}

# DM-19: orígenes del front habilitados por CORS, separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# DM-24: URL del servidor que muestra Swagger. En una máquina virtual, poner su IP (http://192.168.56.10:8082)
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8082}

# DM-23: una línea en la consola (logger INTEGRACION) por cada request a /api/, con IP, módulo (header X-Modulo) y status
app.integracion.log-consultas=${LOG_CONSULTAS:true}
