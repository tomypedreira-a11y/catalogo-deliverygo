spring.application.name=demo

spring.datasource.url=jdbc:h2:mem:deliverygo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql con datos de prueba: se ejecuta después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Especificación OpenAPI con claves ordenadas, para que docs/openapi.yml no cambie de orden entre corridas
springdoc.writer-with-order-by-keys=true
